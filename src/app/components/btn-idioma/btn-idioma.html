<button
  (click)="changeLang(currentLang() === 'es' ? 'en' : 'es')"
  type="button"
  class="cursor-pointer relative w-16 h-7 flex items-center bg-white rounded-full p-1 transition-all duration-300 hover:scale-105"
>
  <div
    class="absolute left-1 flex items-center justify-center w-6 h-6 bg-white rounded-full shadow-md transition-transform duration-300"
    [ngClass]="{ 'translate-x-8': currentLang() === 'es' }"
  >
    <img
      [src]="currentLang() === 'en' ? 'assets/img/lang/pe.svg' : 'assets/img/lang/en.svg'"
      alt="Bandera"
      class="w-5 h-5 rounded-full"
      width="20"
      height="20"
    />
  </div>
  <span
    class="absolute left-10 text-xs font-bold text-gray-800 transition-opacity duration-300"
    [ngClass]="{ 'opacity-100': currentLang() === 'en', 'opacity-0': currentLang() === 'es' }"
    >ES</span
  >
  <span
    class="absolute right-10 text-xs font-bold text-gray-800 transition-opacity duration-300"
    [ngClass]="{ 'opacity-100': currentLang() === 'es', 'opacity-0': currentLang() === 'en' }"
    >EN</span
  >
</button>
