<div class="flex animate-scroll gap-6 hover:pause-animation">
  @for (comentario of comentarios(); track comentario.nombre) {
  <div class="flex-none w-80 bg-white rounded-lg shadow-lg p-6">
    <div class="flex items-center mb-4">
      <img [src]="comentario.foto" [alt]="comentario.nombre" class="w-12 h-12 rounded-full object-cover mr-4">
      <div>
        <h4 class="font-semibold">{{ comentario.nombre }}</h4>
        <p class="text-sm text-gray-500">{{ comentario.fecha }}</p>
      </div>
    </div>
    <div class="flex mb-2">
      @for (star of [1,2,3,4,5]; track star) {
      <svg xmlns="http://www.w3.org/2000/svg" [class.text-yellow-400]="star <= comentario.estrellas"
        [class.text-gray-300]="star > comentario.estrellas" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path
          d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
      </svg>
      }
    </div>
    <p class="text-gray-600">{{ comentario.comentario }}</p>
  </div>
  }
</div>
