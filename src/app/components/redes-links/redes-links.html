<ul class="flex flex-wrap justify-center gap-2" [ngClass]="{ 'grid grid-cols-1 sm:grid-cols-2': layout() === 'grid', 'flex flex-col items-center': layout() === 'column' }">
  @for (item of socialLinks; track item.name) {
  <li class="w-full sm:w-[340px]">
    <a [href]="item.url" target="_blank"
      class="group flex items-center gap-4 p-2 rounded-xl font-semibold transition-all duration-300 w-full text-white hover:scale-105 hover:shadow-xl"
      [ngStyle]="{ background: item.gradient }">
      <div class="flex items-center w-full">
        <!-- Icono -->
        <div
          class="shrink-0 flex items-center justify-center w-12 h-12 rounded-lg bg-white/10 group-hover:bg-white/20 transition-all">
          <fa-icon [icon]="item.icon" class="text-2xl"></fa-icon>
        </div>

        <!-- Texto -->
        <div class="ml-4 flex flex-col justify-center w-full">
          <span class="text-lg font-bold leading-tight">{{ item.name }}</span>
          <span class="text-sm opacity-90 leading-snug">{{ translate.t(item.desc) }}</span>
        </div>
      </div>
    </a>
  </li>
  }
</ul>
