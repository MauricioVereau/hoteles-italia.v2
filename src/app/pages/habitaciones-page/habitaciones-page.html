<section class="xl:min-h-screen">
  <div class="relative w-full h-[300px] sm:h-[500px] overflow-hidden">
    <!-- <img src="assets/img/habitaciones/banner.webp" alt="Habitaciones Hoteles Italia" class="w-full h-full object-cover object-center brightness-50"> -->
    @for (img of imgBanner(); track $index) {
    <div class="absolute inset-0 transition-opacity" [class.opacity-100]="$index === currentImgBanner()"
      [class.opacity-0]="$index !== currentImgBanner()">
      <img [src]="img.src" alt="Habitaciones Hoteles Italia"
        class="w-full h-full object-cover transform scale-100 hover:scale-105 transition duration-4000">
      <div class="absolute inset-0 backdrop-blur-sm bg-black/40"></div>
    </div>
    }
    <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-4">
      <h1 class="text-3xl sm:text-5xl lg:text-6xl font-bold text-white mb-4">
        {{ translate.t('rooms.title') }}
      </h1>
      <span class="text-lg sm:text-xl text-white max-w-3xl">
        {{ translate.t('rooms.description') }}
      </span>
    </div>
  </div>

  <div class="relative z-10 flex flex-col items-center justify-center gap-8 py-8 px-4">
    <h2
      class="text-center font-bold mb-3">
      {{ translate.t('comentarios.title') }}
    </h2>

<div class="overflow-hidden relative py-6 w-full max-w-full sm:max-w-2xl md:max-w-4xl lg:max-w-6xl xl:max-w-7xl mx-auto">
  <app-comentarios />
</div>

  </div>
</section>

<section class="bg-gray-200">
  <div class="py-8 px-4 mx-auto max-w-7xl lg:py-16 lg:px-6">
    <div class="mx-auto max-w-3xl text-center mb-8 lg:mb-12">
      <h2
        class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-linear-to-r from-neutral-800 to-neutral-600 mb-3">
        {{ translate.t('tarifas.title') }}
      </h2>
      <p class="mb-5 font-light text-gray-500 text-base sm:text-xl">
        {{ translate.t('tarifas.description') }}
      </p>
    </div>

    <div class="gap-4">
      <app-tarifas />
    </div>

  </div>
</section>
