<div class="flex flex-col min-h-screen">

  <main class="grow flex flex-col">
    <div class="grow">
      <router-outlet></router-outlet>
    </div>
  </main>
  <app-footer />

  <div class="fab">
    <button onclick="my_modal_3.showModal()"
      class="fixed cursor-pointer bottom-4 right-4 w-14 h-14 flex items-center justify-center text-white bg-linear-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 rounded-full shadow-lg hover:shadow-xl hover:scale-110 transition-all duration-300 z-40 animate-pulse-ring"

  <dialog id="my_modal_3" class="modal">
    <div class="modal-box">
      <modal-reserva/>

  <dialog id="modal_redes" class="modal">
